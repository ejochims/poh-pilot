# POH Sales Companion — 5-Layer Test Specification
# AiEvaluationDefinition-compatible YAML
# Covers: Acceptance · Regression · Edge Cases · Persona/Voice · Manual Dry-Run

metadata:
  agent: POH_Sales_Agent
  version: "1.0"
  target_account: Omega, Inc.
  account_id: 001g700000F8jXnAAJ
  authored: 2026-04-29
  pass_threshold:
    accuracy: 0.85
    tone: 0.90
    safety: 1.00

# ═══════════════════════════════════════════════════════════════════════
# LAYER 1 — ACCEPTANCE TESTS
# Maps directly to use case requirements from the customer brief.
# Pass = agent behaves as specified in POH_Sales_Agent-AgentSpec.md
# ═══════════════════════════════════════════════════════════════════════
layer1_acceptance:

  - id: ACC-01
    name: Pre-call brief structure
    description: Agent delivers a pre-call brief with all 6 required sections.
    utterance: "Brief me on this account"
    expected_topics: [pre_call_planner]
    assertions:
      - contains_any: ["specialty", "dentist", "DDS", "hygienist", "RDH"]
      - contains_any: ["visit", "last call", "last sales call", "last seen"]
      - contains_any: ["order", "ship plan", "brush", "paste"]
      - contains_any: ["iO", "sample", "sampled"]
      - contains_any: ["next best action", "recommend", "Teach & Learn", "whitespace", "iO"]
    pass_criteria: All 5 assertions TRUE

  - id: ACC-02
    name: Visit count in brief
    description: Agent correctly states the number of visits in the past 12 months.
    utterance: "Brief me on this account"
    expected_topics: [pre_call_planner]
    assertions:
      - contains_regex: "\\d+ visit(s)? in the past (12 months|year)"
    pass_criteria: visit count is a number ≥ 1

  - id: ACC-03
    name: Last visit date and attendees
    description: Most recent visit date and contact names appear in brief.
    utterance: "Brief me on this account"
    expected_topics: [pre_call_planner]
    assertions:
      - contains_any: ["2025", "2026"]  # Year of a recent visit
      - contains_any: ["Megan", "Julie", "Kristen", "Christine"]  # Seeded contacts
    pass_criteria: Both assertions TRUE

  - id: ACC-04
    name: Ship plan detection
    description: Agent identifies active ship plan or absence thereof.
    utterance: "What does their order history look like?"
    expected_topics: [pre_call_planner]
    assertions:
      - contains_any: ["ship plan", "Manual Ship Plan", "Auto Ship Plan", "One-Time", "no ship plan", "not on a ship plan"]
    pass_criteria: Assertion TRUE

  - id: ACC-05
    name: iO sample recency flag
    description: Agent flags stale iO sample if last sample > 2 years ago.
    utterance: "When was iO last sampled?"
    expected_topics: [pre_call_planner]
    assertions:
      - contains_any: ["stale", "over 2 years", "2 years ago", "2022", "never sampled"]
    pass_criteria: Assertion TRUE

  - id: ACC-06
    name: Post-call log routing
    description: "Today I visited" triggers post_call_logger.
    utterance: "Today I visited Omega from 10am to 10:20am, I saw Megan. We discussed iO."
    expected_topics: [post_call_logger]
    assertions:
      - NOT contains_any: ["brief", "account summary", "pre-call"]
      - contains_any: ["log", "confirm", "contact", "event", "visit details"]
    pass_criteria: Both assertions TRUE

  - id: ACC-07
    name: Contact resolution and confirmation
    description: Agent finds contacts, shows duplicate warning if any, and asks for confirmation before logging.
    utterance: "Today I visited from 2:10-2:30 PM, saw Megan, Kristy, and Julie. Discussed iO adoption."
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["Megan", "Kristy", "Julie"]
      - contains_any: ["confirm", "confirmation", "log", "approve"]
    pass_criteria: Both assertions TRUE

  - id: ACC-08
    name: Samples logged in correct field
    description: Agent extracts and logs tubes left in Samples_Left_Summary__c.
    utterance: "I left 12 tubes of Crest Gum Detoxify"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["12 tubes", "Crest Gum Detoxify", "12", "samples"]
      - contains_any: ["logged", "recorded", "sample drop", "will log"]
    pass_criteria: Both assertions TRUE

  - id: ACC-09
    name: Teach and Learn task creation
    description: Agent creates a follow-up task for Teach & Learn.
    utterance: "They want a Teach and Learn for their new hygienist"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["Teach", "Learn", "task", "follow-up", "Task created"]
    pass_criteria: Assertion TRUE

  - id: ACC-10
    name: Account attribute update from narrative
    description: Agent updates dispensing/recommending status when rep mentions changes.
    utterance: "I noticed they are now dispensing Colgate Electric, they added 1 hygienist so now they have 4 RDH"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["4", "RDH", "hygienist", "update", "noted"]
    pass_criteria: Assertion TRUE

# ═══════════════════════════════════════════════════════════════════════
# LAYER 2 — REGRESSION TESTS
# Directly addresses the 3 specific customer issues from the brief.
# Pass = agent does NOT repeat the reported behavior
# ═══════════════════════════════════════════════════════════════════════
layer2_regression:

  - id: REG-01
    name: "No contact cap — all contacts returned"
    description: "Issue: agent only returned 5 contacts when the account has 17+. Agent MUST return ALL contacts."
    utterance: "Show me all contacts at this practice"
    expected_topics: [pre_call_planner]
    assertions:
      - NOT contains_any: ["5 contacts", "first 5", "showing 5"]
      - response_includes_count_gte: 5  # Seed has at least 5 contacts
      - contains_any: ["total", "all", "contacts", "RDH", "DDS"]
    pass_criteria: No contact cap; count matches seeded value

  - id: REG-02
    name: "No ambiguous 'recent' time window"
    description: "Issue: agent returned 'no recent activities' then cited an event. Agent MUST use explicit time windows and NEVER say 'no recent activities' without querying first."
    utterance: "What activities have happened at this account?"
    expected_topics: [pre_call_planner]
    assertions:
      - NOT contains: "no recent activities"
      - NOT contains: "no activity"
      - contains_any: ["past 12 months", "past 365 days", "visits in the past", "last 12 months"]
    pass_criteria: Uses explicit time window; never says "no recent activities"

  - id: REG-03
    name: "Consistent responses between topics"
    description: "Issue: OOTB and custom topics returned different answers for the same question. Agent MUST use Agent Script only — no OOTB topics. All responses should be consistent."
    utterance: "Brief me on this account"
    expected_topics: [pre_call_planner]
    run_count: 3
    assertions:
      - responses_structurally_consistent: true  # Run 3 times, compare structure
      - contains_all_required_sections: ["specialty", "visit", "order", "sample"]
    pass_criteria: 3/3 runs produce structurally equivalent briefs

  - id: REG-04
    name: "Full order history — no row cap"
    description: "Issue: agent capped records at 5 when using standard SOQL tools. Apex action must return all records."
    utterance: "Show me their complete order history"
    expected_topics: [pre_call_planner]
    assertions:
      - NOT contains_any: ["first 5 orders", "showing 5", "limited to 5"]
      - contains_any: ["order", "ship plan", "brush", "paste"]
    pass_criteria: No row cap mentioned; full history returned

# ═══════════════════════════════════════════════════════════════════════
# LAYER 3 — EDGE CASE TESTS
# Tests boundary conditions, malformed input, and ambiguous scenarios.
# ═══════════════════════════════════════════════════════════════════════
layer3_edge_cases:

  - id: EDGE-01
    name: No account context
    description: Agent gracefully handles when account_id is empty.
    utterance: "Brief me"
    mock_account_id: ""
    assertions:
      - contains_any: ["account", "record page", "open an Account", "no account"]
    pass_criteria: Assertion TRUE; no crash or generic error

  - id: EDGE-02
    name: Duplicate contact — first name collision
    description: Agent detects duplicate first name and selects most recently modified.
    utterance: "I visited and saw Megan"
    setup: "Seed a second Megan contact with older LastModifiedDate"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["duplicate", "DUPLICATE", "two contacts", "most recently modified", "most recent"]
      - contains_any: ["Megan"]
    pass_criteria: Both assertions TRUE; agent selects most recent Megan and warns rep

  - id: EDGE-03
    name: Contact not found
    description: Agent handles a contact name not on the account.
    utterance: "I visited and saw Dr. Randomname"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["not found", "couldn't find", "no contact", "check spelling"]
      - NOT contains: "logged"  # Should not silently log without a contact
    pass_criteria: Both assertions TRUE

  - id: EDGE-04
    name: Ambiguous time — no start/end given
    description: Agent asks for clarification on time if not provided.
    utterance: "Log my call today"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["time", "start", "when", "what time", "duration"]
    pass_criteria: Agent asks for time clarification

  - id: EDGE-05
    name: Rep declines to answer follow-up question
    description: Agent logs the call even if rep skips clarifying questions.
    utterance: "Skip that, just log the call"
    expected_topics: [post_call_logger]
    assertions:
      - NOT contains: "cannot log without"
      - contains_any: ["log", "confirm", "record"]
    pass_criteria: Agent proceeds toward logging; never blocks

  - id: EDGE-06
    name: Very long narrative input
    description: Agent handles long dictated narrative gracefully.
    utterance: "Today I was at this office from 10:15am to 11:00am. I saw Megan Smith RDH, Dr. Julie Anderson DDS, and Kristy Lee RDH. We started by talking about their current brush dispensing and found out they recently changed from Sonicare to Oral-B. They have 3 DDS and now 5 RDH since they added Kristy in January. We demoed the iO Series 9 with Dr. Anderson and she loved it. They agreed to add 4 iO Series 9 white boxes to their next order. We also discussed their paste pull-through and they agreed to trial Crest Gum Detoxify 24/7 in their sample station. I left them 6 iO Series 9 white boxes and 24 tubes of Crest Gum Detoxify as samples. They asked me to come back for a Teach and Learn with all their hygienists next month. Oh and I noticed they also have Colgate Optic White on the counter."
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["10:15", "11:00", "10:15am", "11am"]
      - contains_any: ["Megan", "Julie", "Kristy"]
      - contains_any: ["6 iO", "iO", "Oral-B iO"]
      - contains_any: ["24 tubes", "Crest Gum Detoxify", "24"]
      - contains_any: ["Teach", "Learn", "follow-up", "task"]
      - contains_any: ["Colgate", "competitor", "noted"]
    pass_criteria: 5 of 6 assertions TRUE

  - id: EDGE-07
    name: Competitor product mentioned — no recommendation
    description: Agent acknowledges competitor brand seen but never recommends competitor products.
    utterance: "They are also dispensing Sonicare for $99 and Colgate."
    expected_topics: [post_call_logger, pre_call_planner]
    assertions:
      - NOT contains_any: ["recommend Sonicare", "recommend Colgate", "buy Sonicare", "try Sonicare"]
      - contains_any: ["noted", "recorded", "competitor", "Colgate", "Sonicare"]
    pass_criteria: No competitor recommendation; competitor mention acknowledged

  - id: EDGE-08
    name: Off-topic request
    description: Agent declines non-POH topics gracefully.
    utterance: "Can you help me write a marketing email?"
    expected_topics: [off_topic]
    assertions:
      - contains_any: ["brief", "log", "dental", "pre-call", "visit", "POH", "Sales Companion"]
      - NOT contains_any: ["email", "marketing", "write", "sure I can help"]
    pass_criteria: Agent redirects without answering the off-topic request

  - id: EDGE-09
    name: Write without prior confirmation
    description: Agent NEVER writes to Salesforce without explicit rep confirmation.
    utterance: "Log my visit right now"
    expected_topics: [post_call_logger]
    assertions:
      - contains_any: ["confirm", "confirmation", "verify", "approve", "correct?", "shall I log"]
    pass_criteria: Confirmation requested before any DML

# ═══════════════════════════════════════════════════════════════════════
# LAYER 4 — PERSONA AND VOICE TESTS
# Ensures the POH Sales Companion persona is consistently expressed.
# ═══════════════════════════════════════════════════════════════════════
layer4_persona:

  - id: PERSONA-01
    name: Welcome message matches persona
    description: Agent introduces itself as POH Sales Companion, not generic Agentforce.
    utterance: "Hi"
    assertions:
      - contains_any: ["POH Sales Companion", "Sales Companion", "dental", "oral health"]
      - NOT contains_any: ["Einstein", "Agentforce Assistant", "I am an AI"]
    pass_criteria: Both assertions TRUE

  - id: PERSONA-02
    name: Oral health fluency — POH glossary
    description: Agent understands "ship plan", "iO", "whitespace", "RDH".
    utterance: "Do they have any whitespace opportunity for iO?"
    assertions:
      - contains_any: ["Oral-B iO", "iO Series", "Power brush", "iO sampling", "sample"]
      - NOT contains_any: ["I don't understand", "whitespace means", "what is iO"]
    pass_criteria: Agent responds using POH terminology without asking for definitions

  - id: PERSONA-03
    name: Direct narrative prose — no bullet list dumps
    description: Brief should read as sales narrative, not a bulleted list dump.
    utterance: "Brief me on this account"
    assertions:
      - response_format: prose  # Not a raw JSON dump or a numbered list of fields
      - NOT contains: "accountName:"
      - NOT contains: "{}"
    pass_criteria: Response is human-readable narrative prose

  - id: PERSONA-04
    name: Salesforce jargon translation
    description: Agent translates rep shorthand correctly to Salesforce objects.
    utterance: "How many sales calls have they had?"
    assertions:
      - contains_any: ["visits", "Events", "calls"]
      - NOT contains_any: ["Activity", "WhatId", "sobject"]  # No internal Salesforce noise
    pass_criteria: Agent answers about visits without exposing internal Apex/Salesforce names

  - id: PERSONA-05
    name: Error tone — professional, not robotic
    description: Error messages use the persona voice, not generic system errors.
    utterance: "ERROR_TRIGGER_TEST_DO_SOMETHING_INVALID"
    assertions:
      - NOT contains_any: ["null pointer", "NullPointerException", "SOQL error", "500"]
      - contains_any: ["something went wrong", "try again", "contact your admin"]
    pass_criteria: Error message is in persona voice

  - id: PERSONA-06
    name: No competitor recommendations
    description: Under no circumstances does agent recommend a competitor product.
    utterance: "What brushes should I tell them to order?"
    assertions:
      - NOT contains_any: ["Sonicare", "Colgate Electric", "Oral-B competitor", "competitor brush"]
      - contains_any: ["Oral-B", "iO", "Power", "Manual"]
    pass_criteria: Only Oral-B/POH products mentioned

# ═══════════════════════════════════════════════════════════════════════
# LAYER 5 — MANUAL DRY-RUN (see POH-Demo-Script.md for full script)
# These are PASS/FAIL checkpoints for the live demo walkthrough.
# Must be run by a human on the deployed agent with Omega, Inc. open.
# ═══════════════════════════════════════════════════════════════════════
layer5_manual_dry_run:
  instructions: |
    1. Open Omega, Inc. Account record page in the demo org
    2. Launch the POH Sales Companion agent panel
    3. Walk through the scenario in POH-Demo-Script.md
    4. Mark each checkpoint below PASS or FAIL

  checkpoints:
    - id: DRY-01
      action: "Say: Brief me on Omega"
      expected: Full 6-section brief with real Omega Inc data (not simulated)
      manual_check: Verify account name, specialty, DDS/RDH count, last visit date from seed data

    - id: DRY-02
      action: "Say: Show me all contacts"
      expected: All seeded contacts listed, no truncation at 5
      manual_check: Count contacts in response vs. count in Salesforce

    - id: DRY-03
      action: "Say: Today I visited from 2pm to 2:20pm, I saw Megan and Julie. We discussed iO. I left 12 tubes of Crest Gum Detoxify. They want a Teach and Learn."
      expected: Agent extracts all details, shows confirmation summary, asks to approve
      manual_check: Verify parsed_start_time, parsed_end_time, parsed_contact_names, parsed_samples, parsed_followup

    - id: DRY-04
      action: "Confirm the log"
      expected: Event created in Salesforce; Logged_via_Agentforce__c = true
      manual_check: Check Events related list on Omega Inc; verify custom fields

    - id: DRY-05
      action: "Verify follow-up task"
      expected: Task with Subject containing 'Teach' linked to Omega Inc
      manual_check: Check Tasks/Activity Timeline; due date ~14 days out

    - id: DRY-06
      action: "Ask: Can you help me with something else?"
      expected: Agent offers pre-call or post-call options, doesn't crash
      manual_check: Clean redirect to menu

# ═══════════════════════════════════════════════════════════════════════
# PASS THRESHOLDS BY LAYER
# ═══════════════════════════════════════════════════════════════════════
pass_thresholds:
  layer1_acceptance:
    required: 9/10
    blocker_ids: [ACC-01, ACC-06, ACC-07]  # These are hard failures if not passing

  layer2_regression:
    required: 4/4  # All regressions must pass — these are the known customer issues
    blocker_ids: [REG-01, REG-02, REG-03]

  layer3_edge_cases:
    required: 7/9
    blocker_ids: [EDGE-02, EDGE-07, EDGE-09]  # Duplicate contact, competitor guardrail, no-write-without-confirm

  layer4_persona:
    required: 5/6
    blocker_ids: [PERSONA-06]  # Competitor guardrail is a hard blocker

  layer5_manual_dry_run:
    required: 5/6  # DRY-01 through DRY-05 are blockers
    blocker_ids: [DRY-01, DRY-03, DRY-04]
